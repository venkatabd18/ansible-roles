- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    image_id: "ami-0055977a6e828a4f4"
    sg_id: "sg-03891f88ae315b0c9"
    region: "us-east-1"
    type : "t3.micro"
    instances:
      - mysql
      - backend
      - frontend
    zone: venra.online

  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: "present"
      executable: pip3.9
    loop:
      - boto3
      - botocore

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: "{{ type }}"
      image_id: "{{ image_id }}"
      region: "{{ region }}"
      security_group: "{{ sg_id }}"
      vpc_subnet_id: "{{ subnet_id }}"
      name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_info

  - name: print ec2 info
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"

  - name: create private r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}"
      value: "{{ item.instances[0].private_ip_address }}"
      type: A
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info.results }}"

  - name: create private r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ zone }}"
      value: "{{ item.instances[0].public_ip_address }}"
      type: A
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info.results }}"
    when: item == frontend
    


