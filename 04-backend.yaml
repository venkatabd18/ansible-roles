- name: configure backend
  hosts: backend
  become: yes
  vars:
    login_host: mysql.venra.online
    login_password: ExpenseApp@1
    login_user: root
  
  tasks:
  - name: disable nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs
    ansible.builtin.command: dnf module enable nodejs:24 -y

  - name: install nodejs and mysql client
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    loop:
      - nodejs
      - mysql

  - name: create app dir
    ansible.builtin.file:
      path: /app
      state: directory

  - name: check expense exixt or not
    ansible.builtin.command: id expense
    ignore_errors: true
    register: user_info

  - name: print user info
    ansible.builtin.debug:
      msg: "{{ user_info }}"

  - name: create expense user
    ansible.builtin.user:
      name: expense
      state: present
    when: user_info.rc != "0"  
  
  - name: download the backend code
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-backend-v5.tar.gz
      dest: /tmp/backend.tar.gz 

  - name: unzip the backend code
    ansible.builtin.unarchive:
      src: /tmp/backend.tar.gz
      dest: /app
      remote_src: yes
  
  - name: install npm
    community.general.npm:
      path: /app

  - name: copy the backend service
    ansible.builtin.copy:
      src: backend.service
      dest: /etc/systemd/system/backend.service
      
  - name: install PyMySQL
    ansible.builtin.pip:
      name: PyMySQL
      state: present
      executable: pip3.9

  - name: load the schema
    community.mysql.mysql_db:
      name: all
      login_host: "{{ login_host }}"
      login_password: "{{ login_password }}"
      login_user: "{{ login_user}}"
      state: "import"
      target: /app/schema/backend.sql
  