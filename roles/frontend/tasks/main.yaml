- name: install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: start the nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: run the tasks from common tasks:
  ansible.builtin.include_role:
    name: common
    tasks_from: main.yaml

