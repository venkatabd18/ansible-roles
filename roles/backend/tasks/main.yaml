- name: disable the nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enable nodejs
  ansible.builtin.command: dnf module enable nodejs:24 -y

- name: install mysql and nodejs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - nodejs
    - mysql

- name: check expense exist or not
  ansible.builtin.command: id expense
  register: user_info
  ignore_errors: true

- name: print user info
  ansible.builtin.debug:
    msg: "{{ user_info }}"

- name: create expense user
  ansible.builtin.user:
    name: expense
    state: present
  when: user_info.rc != "0"

- name: run the tasks from common tasks
  ansible.builtin.include_role:
    name: common
    tasks_from: main.yaml 

- name: install npm
  community.general.npm:
    path: /app

- name: copy the backend service
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service

- name: install PyMySQL
  ansible.builtin.pip:
    name: PyMySQL
    state: present
    executable: pip3.9

- name: Load Database Schema
  community.mysql.mysql_db:
    login_host: "{{ login_host }}"
    login_password: "{{ login_password }}"
    login_user: "{{ login_user }}"
    name: all
    state: "import"
    target: /app/schema/backend.sql

- name: Start the Service
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: backend