- name: disable nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enable nodejs
  ansible.builtin.command: dnf module enable nodejs:24 -y

- name: insatll nodejs and mysql
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - mysql
    - nodejs

- name: install PyMySQL
  ansible.builtin.pip:
    name: PyMySQL
    state: present
    executable: pip3.9

- name: create expense user
  ansible.builtin.user:
    name: expense
    state: present

- name: create app directory
  ansible.builtin.file:
    path: /app
    state: "directory"

- name: download the backend code
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-backend-v5.tar.gz
    dest: /tmp/backend.tar.gz

- name: unzip the code
  ansible.builtin.unarchive:
    src: /tmp/backend.tar.gz
    dest: /app
    remote_src: yes

- name: install npm
  community.general.npm:
    path: /app

- name: copy the banckend service
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    
- name: Load Database Schema
  community.mysql.mysql_db:
    login_host: "{{ login_host }}"
    login_user: "{{ login_user }}"
    login_password: "{{ login_password }}"
    name: all
    state: "import"
    target: /app/schema/backend.sql

- name: Start the Service
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: backend
    state: restarted
