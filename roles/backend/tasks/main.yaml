- name: disable nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enable nodejs
  ansible.builtin.command: dnf module enable nodejs:24 -y

- name: install mysql and nodejs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - mysql
    - nodejs

- name: checke expense user is availble or not
  ansible.builtin.command: id expense
  register: user_info
  ignore_errors: true

- name: print user info
  ansible.builtin.debug:
    msg: "{{ user_info }}"

- name: create expense user
  ansible.builtin.user:
    name: expense
    state: present

- name: Run the tasks from common tasks
  ansible.builtin.import_role:
    name: common
    tasks_from: main.yaml

- name: install npm
  community.general.npm:
    path: "{{ app_location }}"

- name: copy the backend service
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    #remote_src: yes

- name: install PyMySQL
  ansible.builtin.pip:
    name: PyMySQL
    state: present
    executable: pip3.9

- name: load database schema
  community.mysql.mysql_db:
    name: all 
    state: "import"
    login_user: "{{ login_user }}"
    login_host: "{{ login_host }}"
    login_password: "{{ login_password }}"
    target: /app/schema/backend.sql

- name: start the service
  ansible.builtin.systemd_service:
    name: backend
    state: restarted
    daemon_reload: true

