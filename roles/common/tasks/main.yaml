- name: remove the default nginx content
  ansible.builtin.file:
    path: "{{ app_location }}"
    state: absent

- name: create htm directory
  ansible.builtin.file:
    path: "{{ /usr/share/nginx/html }}"
    state: directory

- name: download the {{ component }} code
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-frontend-v5.tar.gz
    dest: /tmp/{{ component }}.tar.gz

- name: unzip the code
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.tar.gz
    dest: "{{ app_location }}"
    remote_src: yes
