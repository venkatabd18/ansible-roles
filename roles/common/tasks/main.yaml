- name: remove existing app location
  ansible.builtin.file:
    path: "{{ app_location }}"
    state: absent
  ignore_errors: true

- name: create app directory
  ansible.builtin.file:
    path: "{{ app_location }}"
    state: directory

- name: "download the {{ component }} code"
  ansible.builtin.unarchive:
    src: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-{{ component }}-v5.tar.gz
    dest: "{{ app_location }}"
    remote_src: yes